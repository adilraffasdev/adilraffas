<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/images/logo.png">
  <title>Admin Login — Adil Raffas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%)}
    .login-card{background:var(--bg-card);border-radius:16px;padding:40px;width:100%;max-width:400px;border:1px solid var(--border);box-shadow:0 25px 50px -12px rgba(0,0,0,.5);text-align:center}
    .login-card img{height:52px;margin-bottom:16px}
    .login-card h1{font-size:1.4rem;font-weight:700;margin-bottom:6px}
    .login-card p.sub{color:var(--text-muted);font-size:.85rem;margin-bottom:28px}
    .form-group{margin-bottom:16px;text-align:left}
    .form-group label{display:block;font-size:.82rem;font-weight:600;color:var(--text-muted);margin-bottom:6px}
    .form-control{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:.9rem}
    .form-control:focus{outline:none;border-color:#005CD8}
    .btn-login{display:flex;align-items:center;justify-content:center;gap:10px;background:#005CD8;color:#fff;border:none;padding:12px;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;width:100%;transition:background .2s}
    .btn-login:hover{background:#0045a0}
    .btn-login:disabled{opacity:.6;cursor:not-allowed}
    .error-msg{color:#ef4444;font-size:.83rem;margin-top:12px;display:none}
  </style>
</head>
<body class="login-page">
  <div class="login-card">
    <img src="assets/images/logo.png" alt="Admin">
    <h1>Admin Panel</h1>
    <p class="sub">Sign in to manage your website</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter your password" required autofocus>
      </div>
      <p class="error-msg" id="errorMsg"><i class="fa-solid fa-circle-xmark"></i> Wrong password</p>
      <button type="submit" class="btn-login" id="loginBtn">
        <i class="fa-solid fa-right-to-bracket"></i> Sign In
      </button>
    </form>
  </div>

  <script>
    var SESSION_KEY = 'ar_admin_session';

    // If already logged in, go to dashboard
    try {
      var s = JSON.parse(localStorage.getItem(SESSION_KEY));
      if (s && Date.now() - s.t < 86400000) {
        window.location.replace('/admin/index.html');
      }
    } catch(e) {}

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      var pass = document.getElementById('password').value.trim();
      var btn  = document.getElementById('loginBtn');
      var err  = document.getElementById('errorMsg');

      // Hash the entered password and compare with stored hash
      // Password hash is set via Netlify environment variable ADMIN_HASH
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying...';

      // Use Web Crypto API to hash password (SHA-256)
      var encoder = new TextEncoder();
      var data = encoder.encode(pass);
      crypto.subtle.digest('SHA-256', data).then(function(hashBuffer) {
        var hashArray = Array.from(new Uint8Array(hashBuffer));
        var hashHex = hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');

        // Fetch the hash from Netlify Function for comparison
        fetch('/.netlify/functions/auth-check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ hash: hashHex })
        })
        .then(function(r) { return r.json(); })
        .then(function(res) {
          if (res.ok) {
            var session = JSON.stringify({ t: Date.now() });
            localStorage.setItem('ar_admin_session', session);
            // Verify it was set
            var check = localStorage.getItem('ar_admin_session');
            if (check) {
              window.location.replace('/admin/index.html');
            } else {
              err.textContent = 'Session error. Please try again.';
              err.style.display = 'block';
              btn.disabled = false;
              btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
            }
          } else {
            err.style.display = 'block';
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
            document.getElementById('password').value = '';
            document.getElementById('password').focus();
          }
        })
        .catch(function() {
          err.textContent = 'Connection error. Try again.';
          err.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
        });
      });
    });
  </script>
</body>
</html>
