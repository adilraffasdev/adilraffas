<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/images/logo.png">
  <title>Admin Login — Adil Raffas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/admin.css">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    .login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%)}
    .login-card{background:var(--bg-card);border-radius:16px;padding:40px;width:100%;max-width:400px;border:1px solid var(--border);box-shadow:0 25px 50px -12px rgba(0,0,0,.5);text-align:center}
    .login-card img{height:52px;margin-bottom:16px}
    .login-card h1{font-size:1.4rem;font-weight:700;margin-bottom:6px}
    .login-card p{color:var(--text-muted);font-size:.85rem;margin-bottom:28px}
    .btn-login{display:inline-flex;align-items:center;gap:10px;background:#005CD8;color:#fff;border:none;padding:13px 28px;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;transition:background .2s;width:100%;justify-content:center}
    .btn-login:hover{background:#0045a0}
    .msg{color:var(--text-muted);font-size:.85rem;margin-top:16px}
  </style>
</head>
<body class="login-page">
  <div class="login-card">
    <img src="assets/images/logo.png" alt="Admin">
    <h1>Admin Panel</h1>
    <p>Sign in to manage your website</p>
    <button class="btn-login" id="loginBtn">
      <i class="fa-solid fa-right-to-bracket"></i> Sign In
    </button>
    <p class="msg" id="msg"></p>
  </div>

  <script>
    var SESSION_KEY = 'ar_admin_session';

    // If already has valid session, go to dashboard immediately
    var existing = localStorage.getItem(SESSION_KEY);
    if (existing) {
      try {
        var d = JSON.parse(existing);
        if (Date.now() - d.time < 86400000) {
          window.location.replace('/admin/index.html');
        } else {
          localStorage.removeItem(SESSION_KEY);
        }
      } catch(e) {
        localStorage.removeItem(SESSION_KEY);
      }
    }

    // On successful Netlify Identity login — set session and redirect
    netlifyIdentity.on('login', function(user) {
      netlifyIdentity.close();
      // Store session with timestamp
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        user: user.email,
        time: Date.now()
      }));
      document.getElementById('msg').textContent = 'Redirecting...';
      document.getElementById('loginBtn').disabled = true;
      window.location.replace('/admin/index.html');
    });

    document.getElementById('loginBtn').addEventListener('click', function() {
      netlifyIdentity.open('login');
    });
  </script>
</body>
</html>
