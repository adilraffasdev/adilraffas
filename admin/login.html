<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/logo.png">
    <title>Admin Login — Adil Raffas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="logo">
            <img src="assets/images/logo.png" alt="Adil Raffas">
            <h1>Admin Panel</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Connectez-vous pour gérer votre site</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" class="form-control" id="username" required autocomplete="username" autofocus>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" class="form-control" id="password" required autocomplete="current-password">
            </div>
            <p id="loginError" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 12px; display: none;">Invalid credentials</p>
            <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">
                <i class="fa-solid fa-right-to-bracket"></i> Sign In
            </button>
        </form>
    </div>
    <script src="js/auth.config.js"></script>
    <script>
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        usernameInput.value = AUTH_CONFIG.username;
        passwordInput.value = AUTH_CONFIG.password;

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = usernameInput.value.trim();
            const pass = passwordInput.value.trim();
            const error = document.getElementById('loginError');
            if (user === AUTH_CONFIG.username && pass === AUTH_CONFIG.password) {
                localStorage.setItem('Adil Raffas_admin', JSON.stringify({ user, loggedIn: true, time: Date.now() }));
                window.location.href = 'index.html';
            } else {
                error.style.display = 'block';
            }
        });
        if (localStorage.getItem('Adil Raffas_admin')) {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
