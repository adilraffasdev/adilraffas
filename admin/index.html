<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/logo.png">
    <title>Tableau de bord — Admin Adil Raffas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="js/chart.js"></script>
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <img src="assets/images/logo.png" alt="Adil Raffas">
                <span>Adil Raffas</span>
            </div>
            <nav class="sidebar-nav" id="sidebarNav"></nav>
            <div class="sidebar-footer" id="sidebarFooter"></div>
        </aside>
        <main class="main-content">
            <div class="topbar">
                <div style="display:flex;align-items:center;gap:12px;">
                    <button class="mobile-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
                    <h2>Tableau de bord</h2>
                </div>
                <div class="topbar-actions">
                    <span style="color:var(--text-muted);font-size:0.85rem;" id="userDisplay"></span>
                </div>
            </div>

            <div class="stats-grid" id="statsGrid" style="grid-template-columns:repeat(5,1fr);"></div>
            <div class="stats-grid" id="financeStats" style="grid-template-columns:repeat(3,1fr);margin-top:-8px;"></div>

            <div class="charts-grid">
                <div class="card">
                    <div class="card-header"><h3>Profit by Category</h3></div>
                    <div class="chart-container" id="categoryChartContainer"><canvas id="categoryChart-canvas"></canvas></div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Monthly Profit</h3></div>
                    <div class="chart-container" id="profitChartContainer"><canvas id="profitChart-canvas"></canvas></div>
                </div>
            </div>

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="card">
                    <div class="card-header"><h3>Recent Activity</h3></div>
                    <div id="recentActivity" style="font-size:0.85rem;color:var(--text-muted);"></div>
                </div>
                <div class="card">
                    <div class="card-header"><h3>Quick Actions</h3></div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                        <a href="services.html" class="btn btn-secondary" style="justify-content:center;"><i class="fa-solid fa-plus"></i> Add Service</a>
                        <a href="packages.html" class="btn btn-secondary" style="justify-content:center;"><i class="fa-solid fa-plus"></i> Add Package</a>
                        <a href="projects.html" class="btn btn-secondary" style="justify-content:center;"><i class="fa-solid fa-plus"></i> Add Project</a>
                        <a href="blogs.html" class="btn btn-secondary" style="justify-content:center;"><i class="fa-solid fa-plus"></i> Add Blog Post</a>
                        <a href="finance.html" class="btn btn-secondary" style="justify-content:center;"><i class="fa-solid fa-plus"></i> Ajouter une transaction</a>
                        <a href="../index.html" class="btn btn-secondary" style="justify-content:center;" target="_blank"><i class="fa-solid fa-eye"></i> View Site</a>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="js/layout.js?2"></script>
    <script src="js/db.js?2"></script>
    <script>
        initLayout('Tableau de bord');

        async function init() {
            await DB.init();
            const services = DB.get('services');
            const packages = DB.get('packages');
            const projects = DB.get('projects');
            const blogs = DB.get('blogs');
            const testimonials = DB.get('testimonials');
            const finance = DB.get('finance');
            const transactions = finance.transactions || [];

            const totalIncome = transactions.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
            const totalExpenses = transactions.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
            const netProfit = totalIncome - totalExpenses;

            document.getElementById('statsGrid').innerHTML = `
                <div class="stat-card"><div class="stat-icon" style="background:rgba(3,150,250,0.15);color:var(--secondary);"><i class="fa-solid fa-cubes"></i></div><div class="stat-info"><h4>Services</h4><div class="value">${services.length}</div></div></div>
                <div class="stat-card"><div class="stat-icon" style="background:rgba(16,185,129,0.15);color:var(--success);"><i class="fa-solid fa-tag"></i></div><div class="stat-info"><h4>Packages</h4><div class="value">${packages.length}</div></div></div>
                <div class="stat-card"><div class="stat-icon" style="background:rgba(245,158,11,0.15);color:var(--warning);"><i class="fa-solid fa-briefcase"></i></div><div class="stat-info"><h4>Projects</h4><div class="value">${projects.length}</div></div></div>
                <div class="stat-card"><div class="stat-icon" style="background:rgba(239,68,68,0.15);color:var(--danger);"><i class="fa-solid fa-newspaper"></i></div><div class="stat-info"><h4>Blog Posts</h4><div class="value">${blogs.length}</div></div></div>
                <div class="stat-card"><div class="stat-icon" style="background:rgba(251,191,36,0.15);color:var(--warning);"><i class="fa-solid fa-star"></i></div><div class="stat-info"><h4>Testimonials</h4><div class="value">${testimonials.length}</div></div></div>
            `;
            document.getElementById('financeStats').innerHTML = `
                <div class="stat-card"><div class="stat-icon" style="background:rgba(3,150,250,0.15);color:var(--secondary);"><i class="fa-solid fa-arrow-down"></i></div><div class="stat-info"><h4>Total Income</h4><div class="value">${totalIncome.toLocaleString()} MAD</div></div></div>
                <div class="stat-card"><div class="stat-icon" style="background:rgba(239,68,68,0.15);color:var(--danger);"><i class="fa-solid fa-arrow-up"></i></div><div class="stat-info"><h4>Total Expenses</h4><div class="value">${totalExpenses.toLocaleString()} MAD</div></div></div>
                <div class="stat-card"><div class="stat-icon" style="background:rgba(16,185,129,0.15);color:var(--success);"><i class="fa-solid fa-coins"></i></div><div class="stat-info"><h4>Net Profit</h4><div class="value">${netProfit.toLocaleString()} MAD</div></div></div>
            `;

            // Monthly grouping
            const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            const monthData = {};
            transactions.forEach(t => {
                const m = t.date.substring(0, 7);
                if (!monthData[m]) monthData[m] = { income: 0, expense: 0 };
                if (t.type === 'income') monthData[m].income += t.amount;
                else monthData[m].expense += t.amount;
            });
            const labels = Object.keys(monthData).sort();
            const incomeData = labels.map(m => monthData[m].income);
            const expenseData = labels.map(m => monthData[m].expense);
            const profitData = labels.map(m => monthData[m].income - monthData[m].expense);

            // Profit by category
            const catMap = {};
            transactions.forEach(t => {
                const cat = t.category || 'Other';
                if (!catMap[cat]) catMap[cat] = { income: 0, expense: 0 };
                if (t.type === 'income') catMap[cat].income += t.amount;
                else catMap[cat].expense += t.amount;
            });
            const catLabels = Object.keys(catMap).sort();
            const catColors = ['#0396FA','#10b981','#f59e0b','#ef4444','#8b5cf6','#ec4899','#14b8a6','#f97316','#6366f1','#84cc16'];
            const catBg = catLabels.map((_, i) => catColors[i % catColors.length]);

            if (catLabels.length) {
                document.getElementById('categoryChartContainer').style.display = 'block';
                document.getElementById('categoryChartContainer').innerHTML = '<canvas id="categoryChart-canvas"></canvas>';
                document.querySelectorAll('.charts-grid .card .chart-empty').forEach(c => c.remove());
                const catProfit = catLabels.map(c => catMap[c].income - catMap[c].expense);
                new Chart(document.getElementById('categoryChart-canvas'), {
                    type: 'doughnut',
                    data: { labels: catLabels, datasets: [{ data: catProfit.map(v => Math.abs(v)), backgroundColor: catBg }] },
                    options: { responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { position: 'right', labels: { color: '#94a3b8', boxWidth: 12, padding: 12 } } },
                        cutout: '55%'
                    }
                });
            } else {
                document.getElementById('categoryChartContainer').style.display = 'none';
                document.querySelectorAll('.charts-grid .card .chart-empty').forEach(c => c.remove());
                const msg = document.createElement('div');
                msg.className = 'chart-empty';
                msg.style.cssText = 'padding:32px;text-align:center;color:var(--text-muted);';
                msg.innerHTML = '<i class="fa-solid fa-chart-pie" style="font-size:2rem;display:block;margin-bottom:8px;opacity:0.3;"></i>Ajouter une transactions to see profit by category';
                document.querySelector('.charts-grid .card:first-child').appendChild(msg);
            }

            if (labels.length) {
                document.getElementById('profitChartContainer').style.display = 'block';
                document.getElementById('profitChartContainer').innerHTML = '<canvas id="profitChart-canvas"></canvas>';
                document.querySelectorAll('.charts-grid .card .chart-empty').forEach(c => c.remove());
                new Chart(document.getElementById('profitChart-canvas'), {
                    type: 'line',
                    data: { labels, datasets: [
                        { label: 'Profit', data: profitData, borderColor: '#10b981', backgroundColor: 'rgba(16,185,129,0.1)', fill: true, tension: 0.4, borderWidth: 2 }
                    ]},
                    options: { responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { labels: { color: '#94a3b8' } } },
                        scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } }
                    }
                });
            } else {
                document.getElementById('profitChartContainer').style.display = 'none';
                document.querySelectorAll('.charts-grid .card .chart-empty').forEach(c => c.remove());
                const msg = document.createElement('div');
                msg.className = 'chart-empty';
                msg.style.cssText = 'padding:32px;text-align:center;color:var(--text-muted);';
                msg.innerHTML = '<i class="fa-solid fa-chart-line" style="font-size:2rem;display:block;margin-bottom:8px;opacity:0.3;"></i>Ajouter une transactions to see monthly profit';
                document.querySelector('.charts-grid .card:nth-child(2)').appendChild(msg);
            }

            // Recent activity
            const recent = transactions.sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 6);
            document.getElementById('recentActivity').innerHTML = recent.length
                ? recent.map(t => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">
                    <span>${t.description}</span>
                    <span style="color:${t.type === 'income' ? 'var(--success)' : 'var(--danger)'};">${t.type === 'income' ? '+' : '-'}${t.amount.toLocaleString()} MAD</span>
                </div>`).join('')
                : '<p style="padding:16px;text-align:center;">No transactions yet</p>';
        }
        init();
    </script>
</body>
</html>
